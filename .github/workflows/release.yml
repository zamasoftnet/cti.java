name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # cti-if depends on zstream (net.zamasoft:zstream-io/-resolver, not on Maven
      # Central). settings.gradle includes it as a composite build from
      # -Pzstream.dir, so check the sibling repository out next to this one.
      - uses: actions/checkout@v4
        with:
          repository: zamasoftnet/zstream
          path: zstream

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build dist
        run: ./gradlew dist -Pzstream.dir=$GITHUB_WORKSPACE/zstream
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cti-java-*.zip
            build/cti-java-*.tar.gz

      - name: Deploy API docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/apidoc
