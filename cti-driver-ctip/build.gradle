dependencies {
    api project(':cti-if')
    testImplementation 'org.apache.pdfbox:pdfbox:2.0.32'
}

// 他言語ドライバのPDF生成タスク
// 各言語ランタイムがPATHにない場合や、サーバー未接続の場合は無視して続行する
def zamasoftRoot = rootProject.projectDir.parentFile

task generateNodejsPdfs(type: Exec) {
    group = 'verification'
    description = 'Node.jsドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.nodejs')
    commandLine 'node', 'test/generate-pdfs.js'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.nodejs/build/test-output').mkdirs() }
}

task generatePerlPdfs(type: Exec) {
    group = 'verification'
    description = 'PerlドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.perl')
    commandLine 'bash', '-c', 'timeout 600 perl -Isrc/code src/test/generate-pdfs.pl'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.perl/build/test-output').mkdirs() }
}

task generatePhpPdfs(type: Exec) {
    group = 'verification'
    description = 'PHPドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.php')
    commandLine 'php', 'examples/generate-pdfs.php'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.php/build/test-output').mkdirs() }
}

task generateRubyPdfs(type: Exec) {
    group = 'verification'
    description = 'RubyドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.ruby')
    commandLine 'ruby', '-Isrc/code', 'src/test/generate-pdfs.rb'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.ruby/build/test-output').mkdirs() }
}

// Python2はEOL(2020年)のためテスト対象外。Python3のみ対応。
task generatePythonPdfs(type: Exec) {
    group = 'verification'
    description = 'Python3ドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.python')
    commandLine 'python3', 'python3/src/test/python3/generate-pdfs.py'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.python/build/test-output').mkdirs() }
}

task generateDotNetPdfs(type: Exec) {
    group = 'verification'
    description = '.NETドライバでPDFを生成する'
    workingDir new File(zamasoftRoot, 'cti.net')
    commandLine 'dotnet', 'run', '--project', 'src/test/generate-pdfs'
    ignoreExitValue = true
    doFirst { new File(zamasoftRoot, 'cti.net/build/test-output').mkdirs() }
}

// テスト実行前に全言語のPDF生成を行う
// 各ドライバは自分の build/test-output/ にPDFを出力する
test.dependsOn generateNodejsPdfs, generatePerlPdfs, generatePhpPdfs, generateRubyPdfs, generatePythonPdfs, generateDotNetPdfs

// Local TLS and v2 regressions. No PDF generators or external server required.
tasks.register('tlsTest', Test) {
    group = 'verification'
    description = 'Local TLS state-machine and plain CTIP regression tests'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'jp/cssj/driver/ctip/tls/**'
    include 'jp/cssj/driver/ctip/v2/V2SessionResultsTest*'
    maxParallelForks = 1
    systemProperty 'tls.test.classpath', sourceSets.test.runtimeClasspath.asPath
    // RealServerIntegrationTest: -Dcti.integration.uri/user/password を試験 JVM へ渡す
    ['cti.integration.uri', 'cti.integration.user', 'cti.integration.password'].each { name ->
        if (System.getProperty(name) != null) {
            systemProperty name, System.getProperty(name)
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

// TLS probes belong to the independent task.
test {
    exclude 'jp/cssj/driver/ctip/tls/**'
}
